[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmock"
dynamic = ["version"]
description = "Chaos engineering for LLM apps: mock OpenAI, Anthropic, Gemini and more, break them on demand, and get a verdict on your client's resilience."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Julien Rabault" }]
keywords = [
    "llm", "mock-server", "openai", "anthropic", "gemini", "testing", "pytest",
    "resilience", "chaos-engineering", "streaming", "rate-limit", "retry",
    "agents", "tool-calling", "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
]

[project.scripts]
llmock = "llmock.cli:app"

# Makes the `llmock` fixture available in any project that installs llmock.
[project.entry-points.pytest11]
llmock = "llmock.pytest_plugin"

[project.urls]
Homepage = "https://github.com/JulienRabault/LLMock"
Repository = "https://github.com/JulienRabault/LLMock"
Issues = "https://github.com/JulienRabault/LLMock/issues"
Changelog = "https://github.com/JulienRabault/LLMock/blob/main/CHANGELOG.md"
Documentation = "https://github.com/JulienRabault/LLMock#readme"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "twine>=5.1.1",
    "jsonschema[format-nongpl]>=4.20",
]
# The real provider SDKs, for end-to-end tests that drive LLMock the way an
# application does. Kept apart from "dev" because they are heavy.
e2e = [
    "openai>=3",
    "anthropic>=1",
    "google-genai>=2",
    "cohere>=7",
    "openai-agents>=0.2",
]

[tool.hatch.version]
path = "llmock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["llmock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# examples/ holds a runnable test file that CI keeps working; scripts/demo_app
# is the GIF's deliberately naive client and must not run with the suite.
testpaths = ["tests", "examples"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
